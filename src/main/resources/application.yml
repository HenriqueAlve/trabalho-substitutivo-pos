spring:
  application:
    name: biblioteca-online
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:biblioteca}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
